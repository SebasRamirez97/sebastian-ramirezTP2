<div class="dashboard-container">
  <header class="navbar">
    <div class="navbar-brand">
      <img src="assets/icons/Gorrito-chef-192x192.png" alt="Logo Foodies" class="navbar-logo" />
      <h2>Foodies</h2>
    </div>

    <nav class="nav">
      <button
        class="btn-nav active"
      >
         Estadísticas
      </button>
      <button class="btn-nav" (click)="irDashboardUsuarios()">Panel Administrador</button>
      <button class="btn-nav" (click)="irPublicaciones()">Publicaciones</button>
      <button class="btn-nav" (click)="irMiPerfil()">Mi Perfil</button>
      <button class="btn-nav btn-logout" (click)="cerrarSesion()">Cerrar Sesión</button>
    </nav>
  </header>

  <!-- 👇 Cambiamos dashboard-container por dashboard-content -->
  <main class="dashboard-content">
    <div class="dashboard-header">
      <div>
        <h2>Panel de Estadísticas y Analítica</h2>
        <p class="subtitle">Analiza la actividad y el rendimiento de la comunidad Foodies</p>
      </div>

      <!-- Selector de Lapso de Tiempo -->
      <div class="filtros-lapso">
        <span style="font-size: 0.9rem; font-weight: 600; color: #4a5568; align-self: center;">Lapso:</span>
        <button
          class="btn-ordenar"
          [class.active]="lapsoSeleccionado() === '7d'"
          (click)="cambiarLapso('7d')"
        >
          Última Semana
        </button>
        <button
          class="btn-ordenar"
          [class.active]="lapsoSeleccionado() === '30d'"
          (click)="cambiarLapso('30d')"
        >
          Último Mes
        </button>
        <button
          class="btn-ordenar"
          [class.active]="lapsoSeleccionado() === 'todo'"
          (click)="cambiarLapso('todo')"
        >
          Histórico
        </button>
      </div>
    </div>

    <!-- Botones Selectores de Gráficos -->
    <div class="graficos-selector-container">
      <button
        class="btn-grafico-tab"
        [class.active]="graficoActivo() === 'publicaciones'"
        (click)="seleccionarGrafico('publicaciones')"
      >
        👥 Publicaciones por Usuario
      </button>
      <button
        class="btn-grafico-tab"
        [class.active]="graficoActivo() === 'comentarios-tiempo'"
        (click)="seleccionarGrafico('comentarios-tiempo')"
      >
        📈 Evolución de Comentarios
      </button>
      <button
        class="btn-grafico-tab"
        [class.active]="graficoActivo() === 'comentarios-publicacion'"
        (click)="seleccionarGrafico('comentarios-publicacion')"
      >
        🥧 Comentarios por Publicación
      </button>
    </div>

    <!-- Contenedor Central del Gráfico Activo -->
    <div class="card-formulario card-grafico-principal">
      <!-- Gráfico 1 -->
      <div class="grafico-panel" [style.display]="graficoActivo() === 'publicaciones' ? 'flex' : 'none'">
        <h3>Cantidad de publicaciones realizadas por cada usuario</h3>
        <div class="canvas-wrapper">
          <canvas #chartPublicaciones></canvas>
        </div>
      </div>

      <!-- Gráfico 2 -->
      <div class="grafico-panel" [style.display]="graficoActivo() === 'comentarios-tiempo' ? 'flex' : 'none'">
        <h3>Cantidad de comentarios realizados en el tiempo</h3>
        <div class="canvas-wrapper">
          <canvas #chartComentariosTiempo></canvas>
        </div>
      </div>

      <!-- Gráfico 3 -->
      <div class="grafico-panel" [style.display]="graficoActivo() === 'comentarios-publicacion' ? 'flex' : 'none'">
        <h3>Cantidad de comentarios en cada publicación</h3>
        <div class="canvas-wrapper">
          <canvas #chartComentariosPub></canvas>
        </div>
      </div>
    </div>
  </main>
</div>
