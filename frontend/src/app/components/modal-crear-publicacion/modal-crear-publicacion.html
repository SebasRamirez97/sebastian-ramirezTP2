<!-- 1. Barra estilo Facebook que aparece fija en el muro -->
<div class="feed-trigger-card" (click)="abrirModal()">
  <div class="trigger-content">
    
    <!-- Condicional para mostrar la imagen de perfil o el avatar predeterminado -->
    @if (usuario()?.avatarUrl) {
      <img [src]="usuario().avatarUrl" alt="Avatar" class="trigger-avatar-img" />
    } @else {
      <div class="avatar-placeholder">👤</div>
    }

    <div class="trigger-input">¿Qué estás cocinando hoy?</div>
  </div>
</div>

<!-- 2. Ventana Modal Flotante (Solo se muestra si isOpen() es true) -->
@if (isOpen()) {
  <div class="modal-overlay" (click)="cerrarModal()">
    <div class="modal-box" (click)="$event.stopPropagation()">
      
      <div class="modal-header">
        <h3>Crear Publicación</h3>
        <button class="btn-close" (click)="cerrarModal()">&times;</button>
      </div>

      <form (submit)="crearPublicacion(); $event.preventDefault()">
        
        <div class="form-group">
          <label for="titulo">Título de la receta</label>
          <input 
            type="text" 
            id="titulo"
            [ngModel]="titulo()" 
            (ngModelChange)="titulo.set($event)"
            name="titulo" 
            placeholder="Ej: Tarta de zanahoria casera" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="descripcion">Descripción de la receta</label>
          <textarea 
            id="descripcion"
            [ngModel]="contenido()" 
            (ngModelChange)="contenido.set($event)"
            name="descripcion" 
            rows="6" 
            placeholder="Escribe aquí los ingredientes, pasos y detalles de tu plato..." 
            required
          ></textarea>
        </div>

        <div class="form-group">
          <label for="imagenInput" class="file-label">
            📷 Subir imagen de la receta
          </label>
          <input 
            type="file" 
            id="imagenInput" 
            (change)="onFileSelected($event)" 
            accept="image/*" 
            style="display: none;"
          />
        </div>

        @if (previewUrl()) {
          <div class="preview-container">
            <img [src]="previewUrl()" alt="Vista previa" class="img-preview" />
          </div>
        }

        <div class="modal-footer">
          <button type="button" class="btn-cancelar" (click)="cerrarModal()">Cancelar</button>
          <button type="submit" class="btn-publicar" [disabled]="cargando()">
            @if (cargando()) { Publicando... } @else { Publicar }
          </button>
        </div>

      </form>
    </div>
  </div>
}
